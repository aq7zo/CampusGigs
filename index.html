<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f5f5f4" />
<title>SlotMatch — freelancing that fits your timetable</title>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --ink: #1c1917;
    --muted: #68635e;
    --line: #dedbd7;
    --paper: #fff;
    --ground: #f5f5f4;
    --dark: #292524;
    --green: #267354;
    --green-bg: #e8f3ed;
    --amber: #9a5b13;
    --amber-bg: #fff3df;
    --red: #9f3a31;
    --red-bg: #fbe9e7;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Aptos", "Helvetica Neue", sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  button, input, select { font: inherit; }
  button { color: inherit; }
  #root { width: min(100%, 760px); margin: 0 auto; padding: 20px 16px 56px; }
  .app-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 4px 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .app-head h1 { margin: 0; font-size: 23px; letter-spacing: -.03em; }
  .app-head p { margin: 0; color: var(--muted); font-size: 13px; text-align: right; }
  main { padding-top: 16px; }
  .card {
    margin: 0 0 14px;
    padding: 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 9px;
  }
  .card h2 { margin: 0 0 10px; font-size: 17px; letter-spacing: -.01em; }
  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .section-head h2 { margin: 0; }
  .hint { margin: -4px 0 12px; color: var(--muted); font-size: 12px; }
  .insight {
    margin-bottom: 14px;
    padding: 13px 14px;
    color: #fff;
    background: var(--dark);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.45;
  }
  .profile-summary { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center; }
  .avatar {
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    color: #fff;
    background: var(--dark);
    font-weight: 700;
  }
  .profile-summary strong { display: block; font-size: 16px; }
  .profile-summary p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .credibility {
    grid-column: 2;
    margin-top: 2px;
    padding-top: 8px;
    border-top: 1px solid #eeece9;
    color: #514c47;
    font-size: 12px;
  }
  .block + .block { margin-top: 16px; padding-top: 16px; border-top: 1px solid #eeece9; }
  .block h3 { margin: 0 0 8px; font-size: 14px; }
  .skills { display: grid; gap: 8px; }
  .skill-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    align-items: center;
  }
  .skill-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 38px;
    padding: 7px 10px;
    background: #fafaf9;
    border: 1px solid var(--line);
    border-radius: 7px;
    cursor: pointer;
    text-align: left;
  }
  .skill-toggle[aria-pressed="true"] {
    color: #fff;
    background: var(--dark);
    border-color: var(--dark);
  }
  .skill-ratio { font-size: 12px; font-variant-numeric: tabular-nums; opacity: .82; }
  .level {
    height: 38px;
    max-width: 126px;
    padding: 0 7px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 12px;
  }
  .availability-grid {
    display: grid;
    grid-template-columns: 38px repeat(3, minmax(0, 1fr));
    gap: 5px;
    width: 100%;
    margin-bottom: 14px;
  }
  .grid-label {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    color: var(--muted);
    font-size: 11px;
  }
  .day-label { justify-content: flex-start; font-weight: 700; }
  .slot {
    min-width: 0;
    height: 34px;
    padding: 0;
    background: #fafaf9;
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
  }
  .slot:hover { border-color: #a8a29e; }
  .slot.busy { color: var(--red); background: var(--red-bg); border-color: #e1aaa5; font-weight: 700; }
  .capacity { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; font-size: 13px; }
  .capacity output { font-weight: 700; font-variant-numeric: tabular-nums; }
  .capacity input { grid-column: 1 / -1; width: 100%; accent-color: var(--dark); }
  .chart { position: relative; display: grid; gap: 8px; }
  .chart::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: calc(94px + (100% - 140px) * .2778);
    border-left: 1px dashed #a8a29e;
    pointer-events: none;
  }
  .bar-row { display: grid; grid-template-columns: 86px minmax(0, 1fr) 38px; gap: 8px; align-items: center; min-width: 0; }
  .bar-name { overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 18px; background: #f0efed; border-radius: 4px; overflow: hidden; }
  .bar { height: 100%; background: #8a8580; border-radius: 4px; }
  .bar.opportunity { background: var(--green); }
  .bar.caution { background: #c27a1c; }
  .bar.selected { box-shadow: inset 0 0 0 2px var(--dark), inset 0 0 0 3px #fff; }
  .bar-value { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chart-key { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 12px 0 0; color: var(--muted); font-size: 11px; }
  .chart-key span { white-space: nowrap; }
  .count { color: var(--muted); font-size: 13px; font-weight: 400; }
  .gig {
    padding: 12px 0;
    border-top: 1px solid #eeece9;
  }
  .gig:first-of-type { border-top: 0; padding-top: 2px; }
  .gig-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .gig-title { font-weight: 700; font-size: 14px; }
  .ratio-badge {
    flex: 0 0 auto;
    padding: 2px 7px;
    border-radius: 6px;
    background: #efeeec;
    font-size: 12px;
    font-weight: 700;
  }
  .ratio-badge.opportunity { color: var(--green); background: var(--green-bg); }
  .ratio-badge.caution { color: var(--amber); background: var(--amber-bg); }
  .gig-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 5px 0; color: var(--muted); font-size: 12px; }
  .gig-fit { color: var(--green); font-size: 12px; font-weight: 700; }
  .empty { margin: 0; color: var(--muted); font-size: 13px; }
  .sdg-note { margin: 20px 0 0; color: var(--muted); font-size: 11px; text-align: center; }
  @media (min-width: 620px) {
    .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 400px) {
    #root { padding: 12px 10px 40px; }
    .app-head { display: block; }
    .app-head p { margin-top: 2px; text-align: left; }
    .card { padding: 14px 12px; }
    .skill-row { grid-template-columns: minmax(0, 1fr) 112px; }
    .level { width: 112px; }
    .bar-row { grid-template-columns: 78px minmax(0, 1fr) 35px; gap: 6px; }
    .chart::after { left: calc(84px + (100% - 119px) * .2778); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useMemo, useState } = React;

// === DATA ===
const uid = () => globalThis.crypto?.randomUUID?.() ??
  `id-${Date.now()}-${Math.random().toString(36).slice(2)}`;
const SKILLS = ["React", "Python", "Writing", "UI Design", "Tutoring", "Data Entry", "Video Editing", "Social Media"];
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const BANDS = ["AM", "PM", "EVE"];
const SLOTS = DAYS.flatMap(day => BANDS.map(band => `${day}-${band}`));
const VALID_SLOTS = new Set(SLOTS);
const DAY_NAMES = { Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday", Sun: "Sunday" };
const BAND_NAMES = { AM: "morning", PM: "afternoon", EVE: "evening" };
const skillMarket = [
  { skill: "React", demand: 142, supply: 45, avgRate: 22 },
  { skill: "UI Design", demand: 95, supply: 38, avgRate: 20 },
  { skill: "Writing", demand: 110, supply: 47, avgRate: 15 },
  { skill: "Python", demand: 128, supply: 63, avgRate: 21 },
  { skill: "Tutoring", demand: 88, supply: 52, avgRate: 18 },
  { skill: "Data Entry", demand: 80, supply: 102, avgRate: 9 },
  { skill: "Video Editing", demand: 104, supply: 40, avgRate: 19 },
  { skill: "Social Media", demand: 90, supply: 78, avgRate: 13 },
];
const marketBySkill = Object.fromEntries(skillMarket.map(item => [item.skill, item]));
const gigs = [
  { id: 1, title: "Build a landing-page component", skill: "React", duration: 4, pay: 60, slots: ["Tue-EVE", "Wed-EVE", "Sat-AM", "Sat-PM"] },
  { id: 2, title: "Fix responsive layout bugs", skill: "React", duration: 3, pay: 45, slots: ["Mon-EVE", "Thu-EVE", "Sun-PM"] },
  { id: 3, title: "Scrape and clean a dataset", skill: "Python", duration: 5, pay: 70, slots: ["Wed-AM", "Fri-AM", "Sat-PM"] },
  { id: 4, title: "Automate a weekly report script", skill: "Python", duration: 3, pay: 48, slots: ["Tue-PM", "Thu-PM"] },
  { id: 5, title: "Write 4 blog posts on fintech", skill: "Writing", duration: 6, pay: 90, slots: ["Mon-AM", "Wed-EVE", "Sun-AM", "Sun-EVE"] },
  { id: 6, title: "Proofread a dissertation chapter", skill: "Writing", duration: 2, pay: 30, slots: ["Fri-EVE", "Sat-EVE"] },
  { id: 7, title: "Design a 3-screen onboarding flow", skill: "UI Design", duration: 5, pay: 95, slots: ["Tue-AM", "Thu-AM", "Sat-AM"] },
  { id: 8, title: "Tutor GCSE maths, 2 sessions", skill: "Tutoring", duration: 3, pay: 54, slots: ["Mon-PM", "Wed-PM", "Fri-PM"] },
  { id: 9, title: "Enter 500 rows into a CRM", skill: "Data Entry", duration: 4, pay: 36, slots: ["Tue-EVE", "Thu-EVE", "Sat-PM", "Sun-PM"] },
  { id: 10, title: "Edit a 5-minute YouTube video", skill: "Video Editing", duration: 4, pay: 72, slots: ["Wed-EVE", "Fri-EVE", "Sun-EVE"] },
  { id: 11, title: "Plan a week of Instagram posts", skill: "Social Media", duration: 3, pay: 42, slots: ["Mon-AM", "Tue-AM", "Fri-AM"] },
  { id: 12, title: "Help with intro Python homework", skill: "Tutoring", duration: 2, pay: 40, slots: ["Thu-PM", "Sat-AM", "Sun-AM"] },
];
const seedProfile = {
  name: "Maya Okafor",
  university: "University of Manchester",
  course: "BSc Computer Science",
  gradYear: "2027",
  headline: "CS sophomore — React and Python, free evenings",
  skills: [{ skill: "React", level: "intermediate" }, { skill: "Writing", level: "beginner" }],
  certifications: [{ id: uid(), title: "Google UX Design Certificate", issuer: "Coursera", year: "2025" }],
  experience: [{ id: uid(), role: "Frontend Lead", org: "University Coding Society", duration: "1 year", description: "Built the society's event-signup site in React" }],
  busy: ["Mon-AM", "Mon-PM", "Wed-AM", "Fri-AM"],
  weeklyHours: 10,
};

// === PURE LOGIC ===
const clampHours = value => Math.min(25, Math.max(0, Math.round(Number(value) || 0)));
const ratioOf = skill => {
  const market = marketBySkill[skill];
  return market && market.supply > 0 ? market.demand / market.supply : 0;
};
const slotLabel = slot => {
  if (!VALID_SLOTS.has(slot)) return "unknown time";
  const [day, band] = slot.split("-");
  return `${DAY_NAMES[day]} ${BAND_NAMES[band]}`;
};
const initials = name => (name || "").trim().split(/\s+/).filter(Boolean).map(word => word[0]).slice(0, 2).join("").toUpperCase() || "?";
const uniqueKnownSkills = skills => [...new Set((skills || []).map(item => item?.skill).filter(skill => SKILLS.includes(skill)))];
const validBusy = busy => new Set((busy || []).filter(slot => VALID_SLOTS.has(slot)));

function matchGigs(profile) {
  const selected = new Set(uniqueKnownSkills(profile.skills));
  const busy = validBusy(profile.busy);
  const hours = clampHours(profile.weeklyHours);
  return gigs
    .filter(gig => selected.has(gig.skill) && gig.duration <= hours && gig.slots.some(slot => VALID_SLOTS.has(slot) && !busy.has(slot)))
    .map(gig => ({
      ...gig,
      freeSlot: gig.slots.find(slot => VALID_SLOTS.has(slot) && !busy.has(slot)),
      ratio: ratioOf(gig.skill),
    }))
    .sort((a, b) => b.ratio - a.ratio || a.id - b.id);
}

function generateInsight(profile) {
  const ranked = uniqueKnownSkills(profile.skills)
    .map(skill => ({ skill, ratio: ratioOf(skill), rate: marketBySkill[skill].avgRate }))
    .sort((a, b) => b.ratio - a.ratio || a.skill.localeCompare(b.skill));
  if (!ranked.length) return "Select a skill to compare demand and find compatible work windows.";
  const weak = [...ranked].sort((a, b) => a.ratio - b.ratio || a.skill.localeCompare(b.skill))[0];
  if (weak.ratio < 1) {
    const better = [...skillMarket].filter(item => item.skill !== weak.skill).sort((a, b) => b.avgRate - a.avgRate || a.skill.localeCompare(b.skill))[0];
    const more = weak.rate > 0 ? Math.round(((better.avgRate - weak.rate) / weak.rate) * 100) : 0;
    return `${weak.skill} is oversupplied at ${weak.ratio.toFixed(1)}×. In this sample, ${better.skill} has a ${more}% higher average rate.`;
  }
  const top = ranked[0];
  const hours = clampHours(profile.weeklyHours);
  if (hours < 2) return `${top.skill} work is in ${top.ratio.toFixed(1)}× demand. Add at least 2 weekly hours to unlock a gig.`;
  const gigsPerWeek = Math.max(1, Math.floor(hours / 4));
  return `${top.skill} work is in ${top.ratio.toFixed(1)}× demand. Your ${hours} free hours could cover about ${gigsPerWeek} typical gig${gigsPerWeek === 1 ? "" : "s"} a week.`;
}

function computeStrength(profile) {
  const identity = [profile.name, profile.university, profile.course, profile.gradYear, profile.headline];
  const identityScore = identity.filter(value => typeof value === "string" && value.trim()).length / identity.length;
  const score = (uniqueKnownSkills(profile.skills).length ? 30 : 0)
    + (clampHours(profile.weeklyHours) > 0 ? 30 : 0)
    + ((profile.experience || []).length ? 20 : 0)
    + ((profile.certifications || []).length ? 10 : 0)
    + identityScore * 10;
  return Math.min(100, Math.max(0, Math.round(score)));
}

// Lightweight acceptance checks stay in the shipped file for fast demo diagnostics.
console.assert(SKILLS.length === 8 && SLOTS.length === 21 && gigs.length === 12, "Seed sizes must remain 8/21/12");
console.assert(ratioOf("React").toFixed(1) === "3.2", "React ratio");
console.assert(ratioOf("Writing").toFixed(1) === "2.3", "Writing ratio");
console.assert(ratioOf("Data Entry").toFixed(1) === "0.8", "Data Entry ratio");
console.assert(ratioOf("Unknown") === 0, "Unknown markets must be guarded");
console.assert(matchGigs(seedProfile).map(gig => gig.id).join(",") === "1,2,5,6", "Seed match order");
console.assert(matchGigs({ ...seedProfile, weeklyHours: 0 }).length === 0, "Zero hours must return no matches");
console.assert(!generateInsight({ ...seedProfile, weeklyHours: 0 }).includes("could cover"), "Zero hours must not claim capacity");
console.assert(computeStrength(seedProfile) >= 0 && computeStrength(seedProfile) <= 100, "Strength bounds");
console.assert(matchGigs({ ...seedProfile, busy: [...seedProfile.busy, "BAD-SLOT"] }).length === 4, "Unknown busy slots ignored");

// === COMPONENTS ===
function ProfileSummary({ profile }) {
  const cert = profile.certifications[0];
  const experience = profile.experience[0];
  return (
    <section className="card" aria-labelledby="profile-title">
      <div className="profile-summary">
        <div className="avatar" aria-hidden="true">{initials(profile.name)}</div>
        <div>
          <strong id="profile-title">{profile.name}</strong>
          <p>{profile.course}, {profile.university} · graduating {profile.gradYear}</p>
          <p>{profile.headline}</p>
        </div>
        <div className="credibility">
          {experience.role} at {experience.org} · {cert.title}, {cert.issuer} {cert.year}
        </div>
      </div>
    </section>
  );
}

function SkillsBlock({ profile, onToggle, onLevel }) {
  return (
    <div className="block">
      <h3>Skills</h3>
      <p className="hint">Choose what you can offer. Ratios update the chart, insight, and matches immediately.</p>
      <div className="skills">
        {SKILLS.map(skill => {
          const selected = profile.skills.find(item => item.skill === skill);
          return (
            <div className="skill-row" key={skill}>
              <button className="skill-toggle" type="button" aria-pressed={Boolean(selected)} onClick={() => onToggle(skill)}>
                <span>{skill}</span><span className="skill-ratio">{ratioOf(skill).toFixed(1)}×</span>
              </button>
              {selected && (
                <select className="level" aria-label={`${skill} level`} value={selected.level} onChange={event => onLevel(skill, event.target.value)}>
                  <option value="beginner">Beginner</option>
                  <option value="intermediate">Intermediate</option>
                  <option value="advanced">Advanced</option>
                </select>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function AvailabilityBlock({ profile, onBusy, onHours }) {
  const busy = validBusy(profile.busy);
  return (
    <div className="block">
      <h3>Availability</h3>
      <p className="hint">Mark when you cannot work. Gig slots are compatible work windows, not proof a full gig fits inside one band.</p>
      <div className="availability-grid" role="group" aria-label="Busy times">
        <div aria-hidden="true"></div>
        {BANDS.map(band => <div className="grid-label" key={band}>{band}</div>)}
        {DAYS.map(day => (
          <React.Fragment key={day}>
            <div className="grid-label day-label">{day}</div>
            {BANDS.map(band => {
              const slot = `${day}-${band}`;
              const isBusy = busy.has(slot);
              return (
                <button
                  className={`slot${isBusy ? " busy" : ""}`}
                  type="button"
                  key={slot}
                  aria-pressed={isBusy}
                  aria-label={`${slotLabel(slot)} — ${isBusy ? "busy" : "free"}`}
                  onClick={() => onBusy(slot)}
                >{isBusy ? "×" : ""}</button>
              );
            })}
          </React.Fragment>
        ))}
      </div>
      <label className="capacity">
        <span>Weekly capacity</span>
        <output>{clampHours(profile.weeklyHours)} h</output>
        <input type="range" min="0" max="25" step="1" value={clampHours(profile.weeklyHours)} onChange={event => onHours(event.target.value)} />
      </label>
    </div>
  );
}

function DemandChart({ profile }) {
  const selected = new Set(uniqueKnownSkills(profile.skills));
  const data = skillMarket
    .map(item => ({ ...item, ratio: ratioOf(item.skill) }))
    .sort((a, b) => b.ratio - a.ratio || a.skill.localeCompare(b.skill));
  return (
    <section className="card" aria-labelledby="chart-title">
      <h2 id="chart-title">Skill demand vs supply</h2>
      <p className="hint">Demand ÷ supply. The dashed marker is 1.0×; selected skills have a dark inset.</p>
      <div className="chart" role="img" aria-label="Demand-to-supply ratios for eight freelance skills">
        {data.map(item => {
          const tone = item.ratio >= 1.5 ? "opportunity" : item.ratio < 1 ? "caution" : "";
          return (
            <div className="bar-row" key={item.skill}>
              <span className="bar-name" title={item.skill}>{item.skill}</span>
              <div className="bar-track">
                <div className={`bar ${tone}${selected.has(item.skill) ? " selected" : ""}`} style={{ width: `${Math.min(100, item.ratio / 3.6 * 100)}%` }}></div>
              </div>
              <span className="bar-value">{item.ratio.toFixed(1)}×</span>
            </div>
          );
        })}
      </div>
      <p className="chart-key"><span>Green: opportunity (≥1.5×)</span><span>Amber: caution (&lt;1.0×)</span></p>
    </section>
  );
}

function GigList({ matched, profile }) {
  if (!matched.length) {
    const selected = new Set(uniqueKnownSkills(profile.skills));
    const suggestion = [...skillMarket]
      .filter(item => !selected.has(item.skill))
      .sort((a, b) => ratioOf(b.skill) - ratioOf(a.skill) || a.skill.localeCompare(b.skill))[0];
    return (
      <section className="card">
        <h2>Matched gigs</h2>
        <p className="empty">
          No gigs fit your current skills, capacity, and free windows.
          {suggestion && <> Try adding <strong>{suggestion.skill}</strong> — it is in {ratioOf(suggestion.skill).toFixed(1)}× demand.</>}
        </p>
      </section>
    );
  }
  return (
    <section className="card">
      <div className="section-head">
        <h2>Matched gigs</h2>
        <span className="count">{matched.length} compatible</span>
      </div>
      {matched.map(gig => {
        const tone = gig.ratio >= 1.5 ? "opportunity" : gig.ratio < 1 ? "caution" : "";
        return (
          <article className="gig" key={gig.id}>
            <div className="gig-top">
              <span className="gig-title">{gig.title}</span>
              <span className={`ratio-badge ${tone}`}>{gig.ratio.toFixed(1)}×</span>
            </div>
            <div className="gig-meta"><span>{gig.skill}</span><span>£{gig.pay}</span><span>{gig.duration} h</span></div>
            <div className="gig-fit">Compatible work window: {slotLabel(gig.freeSlot)}</div>
          </article>
        );
      })}
    </section>
  );
}

function App() {
  const [profile, setProfile] = useState(seedProfile);
  const matched = useMemo(() => matchGigs(profile), [profile]);
  const insight = useMemo(() => generateInsight(profile), [profile]);

  const toggleSkill = skill => {
    if (!SKILLS.includes(skill)) return;
    setProfile(current => {
      const normalized = current.skills.filter((item, index, all) =>
        SKILLS.includes(item.skill) && all.findIndex(candidate => candidate.skill === item.skill) === index
      );
      const has = normalized.some(item => item.skill === skill);
      return { ...current, skills: has ? normalized.filter(item => item.skill !== skill) : [...normalized, { skill, level: "beginner" }] };
    });
  };
  const setSkillLevel = (skill, level) => {
    if (!["beginner", "intermediate", "advanced"].includes(level)) return;
    setProfile(current => ({ ...current, skills: current.skills.map(item => item.skill === skill ? { ...item, level } : item) }));
  };
  const toggleBusy = slot => {
    if (!VALID_SLOTS.has(slot)) return;
    setProfile(current => {
      const clean = [...validBusy(current.busy)];
      return { ...current, busy: clean.includes(slot) ? clean.filter(item => item !== slot) : [...clean, slot] };
    });
  };
  const setHours = value => setProfile(current => ({ ...current, weeklyHours: clampHours(value) }));

  return (
    <div>
      <header className="app-head">
        <h1>SlotMatch</h1>
        <p>Freelancing that fits your timetable</p>
      </header>
      <main>
        <div className="insight" role="status">Insight: {insight}</div>
        <DemandChart profile={profile} />
        <GigList matched={matched} profile={profile} />
        <ProfileSummary profile={profile} />
        <section className="card">
          <h2>Edit matching profile</h2>
          <SkillsBlock profile={profile} onToggle={toggleSkill} onLevel={setSkillLevel} />
          <AvailabilityBlock profile={profile} onBusy={toggleBusy} onHours={setHours} />
        </section>
        <p className="sdg-note">Built for SDG 8: decent work and economic growth for young people.</p>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
