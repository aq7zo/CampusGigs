  css.split(";").filter((d) => d.trim()).map((d) => {
    const i = d.indexOf(":");
    const k = d.slice(0, i).trim();
    return [k.startsWith("--") ? k : k.replace(/-([a-z])/g, (_, c) => c.toUpperCase()), d.slice(i + 1).trim()];

));

const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_NAMES = { Mon:"Monday", Tue:"Tuesday", Wed:"Wednesday", Thu:"Thursday", Fri:"Friday", Sat:"Saturday", Sun:"Sunday" };

const BAND_RANGES = { AM: [0, 12], PM: [12, 18], EVE: [18, 24] };
const fmtHour = (h) => {
  if (h === 0 || h === 24) return "12am";
  if (h === 12) return "12pm";
  return h < 12 ? h + "am" : (h - 12) + "pm";
};
const mergeAvail = (blocks) => {
  const out = [];
  DAYS.forEach((day) => {
    const dayBlocks = blocks.filter((b) => b.day === day).sort((a, b) => a.start - b.start);
    dayBlocks.forEach((b) => {
      const last = out[out.length - 1];
      if (last && last.day === day && b.start <= last.end) {
        last.end = Math.max(last.end, b.end);
      } else {
        out.push({ ...b });
      }
    });
  });
  return out;
};

const totalHoursOf = (avail) => avail.reduce((n, b) => n + (b.end - b.start), 0);

/* A declared window counts for a band only if it overlaps it by a full hour;
   the label names the real overlap, not the whole band. */
const windowForSlot = (avail, slot) => {
  const parts = slot.split("-");
  const range = BAND_RANGES[parts[1]];
  if (!range) return null;
  const hit = avail.find((b) => b.day === parts[0] && Math.min(b.end, range[1]) - Math.max(b.start, range[0]) >= 1);
  if (!hit) return null;
  return DAY_NAMES[parts[0]] + " " + fmtHour(Math.max(hit.start, range[0])) + "–" + fmtHour(Math.min(hit.end, range[1]));
};

const matchBriefs = (avail, skillNames) => {
  const capacity = totalHoursOf(avail);
  return BRIEFS
    .filter((b) => skillNames.includes(b.skill) && b.duration <= capacity && b.slots.some((sl) => windowForSlot(avail, sl)))
    .map((b) => ({
      ...b,
      freeSlotLabel: windowForSlot(avail, b.slots.find((sl) => windowForSlot(avail, sl))),
      ratio: ratioOf(b.skill),
      ratioLabel: ratioOf(b.skill).toFixed(1) + "×",
    }))
    .sort((a, c) => c.ratio - a.ratio || a.id - c.id);
};

    skills: [{ skill: "React", level: "intermediate" }, { skill: "UI Design", level: "beginner" }],
    avail: SEED_AVAIL,
  },
  search: "",
  activeCategory: "All",
  sortBy: "recommended",
  gigs: SEED_GIGS,
  nextGigId: 17,
  cart: [],
  cartOpen: false,
  selectedGigId: null,
  selectedTierIdx: 0,
  checkoutOpen: false,
  orderPlaced: false,
  checkoutName: "",
  checkoutEmail: "",
  checkoutPhone: "",
  checkoutError: "",
  pendingConversationIds: [],
  conversations: SEED_CONVERSATIONS,
  activeConversationId: "chat-priya-alex",
  chatDraft: "",
  newGigOpen: false,
  newGig: blankNewGig(),
});

const loadLocalState = () => {
  const base = makeInitialState();
  try {
    const saved = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "null");
    if (!saved || saved.version !== 1) return base;
    return {
      ...base,
      profile: saved.profile && typeof saved.profile === "object" ? saved.profile : base.profile,
      gigs: Array.isArray(saved.gigs) ? saved.gigs : base.gigs,
      nextGigId: Number.isInteger(saved.nextGigId) ? saved.nextGigId : base.nextGigId,
      cart: Array.isArray(saved.cart) ? saved.cart : base.cart,
      conversations: Array.isArray(saved.conversations) ? saved.conversations : base.conversations,
    };
  } catch (error) {
    console.warn("CampusGigs could not restore local data.", error);
    return base;
  }
};

const saveLocalState = (state) => {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: 1,
      profile: state.profile,
      gigs: state.gigs,
      nextGigId: state.nextGigId,
      cart: state.cart,
      conversations: state.conversations,
    }));
  } catch (error) {
    console.warn("CampusGigs could not save local data.", error);
  }
};

const makeId = (prefix) => prefix + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
const initialsFor = (name) => (name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0].toUpperCase()).join("");
const freelancerIdFor = (freelancer) => freelancer.id || freelancer.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

class App extends React.Component {
  state = loadLocalState();

  setViewClient = () => this.setState({ viewMode: "client", chatRole: "client" });
  setViewFreelancer = () => this.setState({ viewMode: "freelancer", chatRole: "freelancer" });
  setViewChat = () => this.setState({ viewMode: "chat" });
  onSearchChange = (e) => this.setState({ search: e.target.value });
  onSortChange = (e) => this.setState({ sortBy: e.target.value });
  setCategory = (cat) => this.setState({ activeCategory: cat });

  toggleCart = () => this.setState((s) => ({ cartOpen: !s.cartOpen }));

  addToCart = (gigId, tierIdx) => {
    this.setState((s) => {
      const key = gigId + "-" + tierIdx;
      const existing = s.cart.find((l) => l.key === key);
      const cart = existing
        ? s.cart.map((l) => (l.key === key ? { ...l, qty: l.qty + 1 } : l))
        : [...s.cart, { key, gigId, tierIdx, qty: 1 }];
      return { cart, cartOpen: true };
    });
  };

  changeQty = (key, delta) => this.setState((s) => ({
    cart: s.cart.map((l) => (l.key === key ? { ...l, qty: Math.max(1, l.qty + delta) } : l)),
  }));

  removeCartLine = (key) => this.setState((s) => ({ cart: s.cart.filter((l) => l.key !== key) }));

  openGig = (id) => this.setState({ selectedGigId: id, selectedTierIdx: 0 });
  closeGig = () => this.setState({ selectedGigId: null });
  selectTier = (idx) => this.setState({ selectedTierIdx: idx });
  addSelectedTier = () => {
    this.addToCart(this.state.selectedGigId, this.state.selectedTierIdx);
    this.setState({ selectedGigId: null });
  };

  openCheckout = () => {
    if (!this.state.cart.length) return;
    this.setState({ checkoutOpen: true, cartOpen: false, orderPlaced: false, checkoutError: "", pendingConversationIds: [] });
  };
  closeCheckout = () => this.setState({ checkoutOpen: false, cartOpen: true });
  onCheckoutNameChange = (e) => this.setState({ checkoutName: e.target.value, checkoutError: "" });
  onCheckoutEmailChange = (e) => this.setState({ checkoutEmail: e.target.value, checkoutError: "" });
  onCheckoutPhoneChange = (e) => this.setState({ checkoutPhone: e.target.value, checkoutError: "" });

  placeOrder = (e) => {
    if (e) e.preventDefault();
    this.setState((s) => {
      if (s.orderPlaced) return null;
      const name = s.checkoutName.trim();
      const email = s.checkoutEmail.trim();
      const phone = s.checkoutPhone.trim();
      const phoneDigits = phone.replace(/\D/g, "");
      if (!s.cart.length) return { checkoutError: "Your cart is empty." };
      if (!name) return { checkoutError: "Enter your name." };
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return { checkoutError: "Enter a valid email address." };
      if (!/^[+\d\s().-]+$/.test(phone) || phoneDigits.length < 7 || phoneDigits.length > 15) {
        return { checkoutError: "Enter a valid contact number with 7–15 digits." };
      }

      const grouped = new Map();
      s.cart.forEach((line) => {
        const gig = s.gigs.find((item) => item.id === line.gigId);
        const tier = gig && gig.tiers[line.tierIdx];
        if (!gig || !tier) return;
        const freelancerId = freelancerIdFor(gig.freelancer);
        const group = grouped.get(freelancerId) || { freelancer: { ...gig.freelancer, id: freelancerId }, items: [] };
        group.items.push({ title: gig.title, tierName: tier.name, qty: line.qty, total: tier.price * line.qty });
        grouped.set(freelancerId, group);
      });
      if (!grouped.size) return { checkoutError: "The items in your cart are no longer available." };

      const now = new Date().toISOString();
      const pendingConversationIds = [];
      let conversations = [...s.conversations];
      grouped.forEach((group, freelancerId) => {
        const detail = group.items.map((item) => item.title + " (" + item.tierName + " ×" + item.qty + ")").join(", ");
        const existingIndex = conversations.findIndex((conversation) =>
          conversation.client.id === CURRENT_CLIENT_ID && freelancerIdFor(conversation.freelancer) === freelancerId
        );
        const message = {
          id: makeId("message"),
          sender: "client",
          body: "I’ve placed an order for " + detail + ". Let me know what you need to get started.",
          sentAt: now,
        };
        if (existingIndex >= 0) {
          const current = conversations[existingIndex];
          conversations[existingIndex] = {
            ...current,
            updatedAt: now,
            client: { id: CURRENT_CLIENT_ID, name, email, phone },
            order: { title: group.items[0].title, detail: group.items.length > 1 ? group.items.length + " items" : group.items[0].tierName + " tier" },
            messages: [...current.messages, message],
          };
          pendingConversationIds.push(current.id);
        } else {
          const id = makeId("chat");
          conversations.push({
            id,
            createdAt: now,
            updatedAt: now,
            client: { id: CURRENT_CLIENT_ID, name, email, phone },
            freelancer: group.freelancer,
            order: { title: group.items[0].title, detail: group.items.length > 1 ? group.items.length + " items" : group.items[0].tierName + " tier" },
            messages: [message],
          });
          pendingConversationIds.push(id);
        }
      });
      return { conversations, pendingConversationIds, orderPlaced: true, checkoutError: "" };
    });
  };

  finishCheckout = () => this.setState((s) => ({
    checkoutOpen: false,
    orderPlaced: false,
    cart: [],
    checkoutName: "",
    checkoutEmail: "",
    checkoutPhone: "",
    checkoutError: "",
    viewMode: "chat",
    chatRole: "client",
    activeConversationId: s.pendingConversationIds[0] || s.activeConversationId,
    pendingConversationIds: [],
  }));

  conversationsForRole = (state, role) => state.conversations.filter((conversation) =>
    role === "client"
      ? conversation.client.id === CURRENT_CLIENT_ID
      : freelancerIdFor(conversation.freelancer) === CURRENT_FREELANCER_ID
  );

  setChatRole = (role) => this.setState((s) => {
    const conversations = this.conversationsForRole(s, role);
    const selectedIsVisible = conversations.some((conversation) => conversation.id === s.activeConversationId);
    return {
      chatRole: role,
      activeConversationId: selectedIsVisible ? s.activeConversationId : (conversations[0] ? conversations[0].id : null),
    };
  });
  selectConversation = (id) => this.setState({ activeConversationId: id, chatDraft: "" });
  onChatDraftChange = (e) => this.setState({ chatDraft: e.target.value });
  sendMessage = (e) => {
    e.preventDefault();
    const body = this.state.chatDraft.trim();
    if (!body || !this.state.activeConversationId) return;
    const sentAt = new Date().toISOString();
    this.setState((s) => ({
      chatDraft: "",
      conversations: s.conversations.map((conversation) => conversation.id === s.activeConversationId ? {
        ...conversation,
        updatedAt: sentAt,
        messages: [...conversation.messages, { id: makeId("message"), sender: s.chatRole, body, sentAt }],
      } : conversation),
    }));
  };

  messageSelectedFreelancer = () => {
    const gig = this.state.gigs.find((item) => item.id === this.state.selectedGigId);
    if (!gig) return;
    const freelancerId = freelancerIdFor(gig.freelancer);
    this.setState((s) => {
      const existing = s.conversations.find((conversation) =>
        conversation.client.id === CURRENT_CLIENT_ID && freelancerIdFor(conversation.freelancer) === freelancerId
      );
      if (existing) {
        return { viewMode: "chat", chatRole: "client", activeConversationId: existing.id, selectedGigId: null };
      }
      const id = makeId("chat");
      const now = new Date().toISOString();
      return {
        viewMode: "chat",
        chatRole: "client",
        activeConversationId: id,
        selectedGigId: null,
        conversations: [...s.conversations, {
          id,
          createdAt: now,
          updatedAt: now,
          client: { id: CURRENT_CLIENT_ID, name: "You", email: "", phone: "" },
          freelancer: { ...gig.freelancer, id: freelancerId },
          order: { title: gig.title, detail: "Pre-order enquiry" },
          messages: [],
        }],
      };
    });
  };

  openNewGig = () => this.setState({ newGigOpen: true });
  closeNewGig = () => this.setState({ newGigOpen: false, newGig: blankNewGig() });
  onNewGigTitleChange = (e) => this.setState((s) => ({ newGig: { ...s.newGig, title: e.target.value } }));
  onNewGigCategoryChange = (e) => this.setState((s) => ({ newGig: { ...s.newGig, category: e.target.value } }));
  onNewGigDescChange = (e) => this.setState((s) => ({ newGig: { ...s.newGig, desc: e.target.value } }));
  setNewGigTierPrice = (idx, v) => this.setState((s) => {
    const tierPrices = [...s.newGig.tierPrices]; tierPrices[idx] = v;
    return { newGig: { ...s.newGig, tierPrices } };
  });
  setNewGigTierDelivery = (idx, v) => this.setState((s) => {
    const tierDeliveries = [...s.newGig.tierDeliveries]; tierDeliveries[idx] = v;
    return { newGig: { ...s.newGig, tierDeliveries } };
  });

  submitNewGig = () => {
    const { newGig, gigs, nextGigId } = this.state;
    if (!newGig.title.trim()) return;
    const names = ["Basic", "Standard", "Premium"];
    const tiers = names.map((name, i) => ({
      name,
      price: Number(newGig.tierPrices[i]) || 0,
      delivery: newGig.tierDeliveries[i] || "—",
    }));
    const gig = {
      id: nextGigId, category: newGig.category, title: newGig.title.trim(),
      freelancer: FREELANCERS.priya, desc: newGig.desc.trim() || "No description yet.",
      tiers, owner: true, active: true, orders: 0, earnings: 0,
    };
    this.setState({
      gigs: [...gigs, gig], nextGigId: nextGigId + 1, newGigOpen: false,
      newGig: blankNewGig(),
    });
  };

  setFreelancerTab = (tab) => this.setState({ freelancerTab: tab });

  toggleSkill = (skill) => this.setState((s) => {
    const has = s.profile.skills.some((x) => x.skill === skill);
    const skills = has
      ? s.profile.skills.filter((x) => x.skill !== skill)
      : [...s.profile.skills, { skill, level: "beginner" }];
    return { profile: { ...s.profile, skills } };
  });

  componentDidMount() {
    window.addEventListener("pointermove", this.onDragMove);
    window.addEventListener("pointerup", this.onDragEnd);
  }
  componentDidUpdate(prevProps, prevState) {
    const durableChanged =
      prevState.profile !== this.state.profile ||
      prevState.gigs !== this.state.gigs ||
      prevState.nextGigId !== this.state.nextGigId ||
      prevState.cart !== this.state.cart ||
      prevState.conversations !== this.state.conversations;
    if (!durableChanged) return;
    window.clearTimeout(this.persistTimer);
    this.persistTimer = window.setTimeout(() => saveLocalState(this.state), 120);
  }
  componentWillUnmount() {
    window.removeEventListener("pointermove", this.onDragMove);
    window.removeEventListener("pointerup", this.onDragEnd);
    window.clearTimeout(this.persistTimer);
  }

  hourFromX = (rect, clientX) => {
    const h = Math.round(((clientX - rect.left) / rect.width) * 24);
    return Math.max(0, Math.min(24, h));
  };

  startCreate = (day) => (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const h = this.hourFromX(rect, e.clientX);
    const start = Math.min(23, h);
    const id = "a" + Date.now() + Math.random().toString(36).slice(2, 6);
    this.drag = { mode: "create", id, rect, anchor: start };
    e.preventDefault();
    this.setState((s) => ({ profile: { ...s.profile, avail: [...(s.profile.avail || []), { id, day, start, end: start + 1 }] } }));
  };

  startResize = (id, edge) => (e) => {
    e.stopPropagation();
    const track = e.currentTarget.closest("[data-daytrack]");
    if (!track) return;
    this.drag = { mode: edge === "start" ? "resize-start" : "resize-end", id, rect: track.getBoundingClientRect() };
    e.preventDefault();
  };

  onDragMove = (e) => {
    const d = this.drag;
    if (!d) return;
    const h = this.hourFromX(d.rect, e.clientX);
    this.setState((s) => ({
      profile: {
        ...s.profile,
        avail: (s.profile.avail || []).map((b) => {
          if (b.id !== d.id) return b;
          if (d.mode === "create") {
            const st = Math.min(d.anchor, h);
            const en = Math.max(d.anchor, h);
            return { ...b, start: Math.min(st, 23), end: Math.max(Math.min(st, 23) + 1, en) };
          }
          if (d.mode === "resize-start") return { ...b, start: Math.min(h, b.end - 1) };
          return { ...b, end: Math.max(h, b.start + 1) };
        }),
      },
    }));
  };

  onDragEnd = () => {
    if (!this.drag) return;
    this.drag = null;
    this.setState((s) => ({ profile: { ...s.profile, avail: mergeAvail(s.profile.avail || []) } }));
  };

  removeBlock = (id) => this.setState((s) => ({ profile: { ...s.profile, avail: (s.profile.avail || []).filter((b) => b.id !== id) } }));

  togglePauseGig = (id) => this.setState((s) => ({
    gigs: s.gigs.map((g) => (g.id === id ? { ...g, active: !g.active } : g)),
  }));

  renderVals() {
    const s = this.state;
    const fromPrice = (gig) => Math.min(...gig.tiers.map((t) => t.price));

    const categoryChips = ["All", ...SKILL_CATEGORIES].map((cat) => ({
      label: cat,
      cls: "tag " + (s.activeCategory === cat ? "tag-accent" : "tag-outline"),
      select: () => this.setCategory(cat),
    }));

    let list = s.gigs.filter((g) => g.active !== false);
    if (s.activeCategory !== "All") list = list.filter((g) => g.category === s.activeCategory);
    if (s.search.trim()) {
      const q = s.search.trim().toLowerCase();
      list = list.filter((g) => g.title.toLowerCase().includes(q) || g.category.toLowerCase().includes(q) || g.freelancer.name.toLowerCase().includes(q));
    }
    if (s.sortBy === "price-asc") list = [...list].sort((a, b) => fromPrice(a) - fromPrice(b));
    else if (s.sortBy === "price-desc") list = [...list].sort((a, b) => fromPrice(b) - fromPrice(a));
    else if (s.sortBy === "rating") list = [...list].sort((a, b) => b.freelancer.rating - a.freelancer.rating);

    const filteredGigs = list.map((g) => ({
      ...g,
      fromPrice: fromPrice(g),
      open: () => this.openGig(g.id),
      quickAdd: (e) => { e.stopPropagation(); this.addToCart(g.id, 0); },
    }));

    const resultsLabel = filteredGigs.length + " gig" + (filteredGigs.length === 1 ? "" : "s") + (s.activeCategory === "All" ? "" : " in " + s.activeCategory);

    const cartLines = s.cart.map((l) => {
      const gig = s.gigs.find((g) => g.id === l.gigId);
      const tier = gig ? gig.tiers[l.tierIdx] : null;
      return {
        key: l.key, qty: l.qty,
        title: gig ? gig.title : "Removed gig",
        tierName: tier ? tier.name : "",
        price: tier ? tier.price : 0,
        lineTotal: tier ? tier.price * l.qty : 0,
        inc: () => this.changeQty(l.key, 1),
        dec: () => this.changeQty(l.key, -1),
        remove: () => this.removeCartLine(l.key),
      };
    });
    const cartCount = cartLines.reduce((n, l) => n + l.qty, 0);
    const cartSubtotal = cartLines.reduce((n, l) => n + l.lineTotal, 0);

    let selectedGig = null;
    const gigForDetail = s.selectedGigId ? s.gigs.find((g) => g.id === s.selectedGigId) : null;
    if (gigForDetail) {
      selectedGig = {
        ...gigForDetail,
        tierOptions: gigForDetail.tiers.map((t, i) => ({
          name: t.name, price: t.price, delivery: t.delivery,
          cls: "card blueprint tier-opt" + (i === s.selectedTierIdx ? " tier-selected" : ""),
          select: () => this.selectTier(i),
        })),
      };
    }

    const myGigs = s.gigs.filter((g) => g.owner).map((g) => ({
      ...g, fromPrice: fromPrice(g),
      statusLabel: g.active !== false ? "Active" : "Paused",
      statusCls: g.active !== false ? "tag-accent" : "tag-neutral",
      toggleLabel: g.active !== false ? "Pause" : "Resume",
      rowOpacity: g.active !== false ? 1 : 0.55,
      togglePause: () => this.togglePauseGig(g.id),
    }));
    const stats = {
      active: myGigs.filter((g) => g.active !== false).length,
      orders: myGigs.reduce((n, g) => n + g.orders, 0),
      earnings: myGigs.reduce((n, g) => n + g.earnings, 0),
    };

    const newGigTierRows = ["Basic", "Standard", "Premium"].map((name, i) => ({
      name,
      price: s.newGig.tierPrices[i],
      delivery: s.newGig.tierDeliveries[i],
      onPrice: (e) => this.setNewGigTierPrice(i, e.target.value),
      onDelivery: (e) => this.setNewGigTierDelivery(i, e.target.value),
    }));

    const p = { ...s.profile, avail: s.profile.avail || [], skills: s.profile.skills || [] };
    const mySkillNames = p.skills.map((x) => x.skill);

    const skillChips = SKILL_CATEGORIES.map((skill) => ({
      label: skill,
      ratio: ratioOf(skill).toFixed(1) + "×",
      cls: "tag " + (mySkillNames.includes(skill) ? "tag-accent" : "tag-outline"),
      toggle: () => this.toggleSkill(skill),
    }));

    const demandRows = SKILL_MARKET
      .map((m) => {
        const r = m.demand / m.supply;
        const mine = mySkillNames.includes(m.skill);
        return {
          skill: m.skill,
          value: r.toFixed(1) + "×",
          rate: "avg £" + m.avgRate + "/h",
          barWidth: Math.min(100, (r / 3.6) * 100) + "%",
          barColor: r >= 1.5 ? "var(--color-accent-700)" : r < 1.0 ? "var(--color-neutral-400)" : "var(--color-accent-300)",
          labelWeight: mine ? 700 : 400,
          mineMark: mine ? "yours" : "",
        };
      })
      .sort((a, b) => parseFloat(b.value) - parseFloat(a.value));

    const availByDay = DAYS.map((day) => ({
      day,
      startCreate: this.startCreate(day),
      blocks: p.avail.filter((b) => b.day === day).map((b) => ({
        id: b.id,
        leftPct: (b.start / 24) * 100 + "%",
        widthPct: ((b.end - b.start) / 24) * 100 + "%",
        label: fmtHour(b.start) + "–" + fmtHour(b.end),
        wide: b.end - b.start >= 3,
        resizeStart: this.startResize(b.id, "start"),
        resizeEnd: this.startResize(b.id, "end"),
        remove: () => this.removeBlock(b.id),
        removeOnRightClick: (e) => { e.preventDefault(); e.stopPropagation(); this.removeBlock(b.id); },
      })),
    }));
    const hourTicks = [0, 4, 8, 12, 16, 20, 24].map((h) => ({
      label: fmtHour(h),
      leftPct: (h / 24) * 100 + "%",
      shift: h === 0 ? "translateX(0)" : h === 24 ? "translateX(-100%)" : "translateX(-50%)",
    }));
    const totalHours = totalHoursOf(p.avail);
    const windowCount = p.avail.length;

    const matchedBriefs = matchBriefs(p.avail, mySkillNames);

    let insight;
    if (mySkillNames.length === 0) {
      insight = "Add a skill to see where demand is running ahead of supply.";
    } else {
      const ranked = mySkillNames
        .filter((sk) => MARKET_BY_SKILL[sk])
        .map((sk) => ({ skill: sk, ratio: ratioOf(sk), rate: MARKET_BY_SKILL[sk].avgRate }))
        .sort((a, c) => c.ratio - a.ratio);
      const top = ranked[0];
      const weak = ranked[ranked.length - 1];
      if (weak.ratio < 1.0) {
        const better = SKILL_MARKET.filter((m) => m.skill !== weak.skill).sort((a, c) => c.avgRate - a.avgRate)[0];
        const pct = Math.round(((better.avgRate - weak.rate) / weak.rate) * 100);
        insight = weak.skill + " is oversupplied at " + weak.ratio.toFixed(1) + "×. In this sample, " + better.skill + " has a " + pct + "% higher average rate.";
      } else if (totalHours < 2) {
        insight = top.skill + " work is in " + top.ratio.toFixed(1) + "× demand. Draw at least 2 hours of availability to take on a gig.";
      } else {
        const n = Math.max(1, Math.floor(totalHours / 4));
        insight = top.skill + " work is in " + top.ratio.toFixed(1) + "× demand. The " + totalHours + " hours you've declared cover about " + n + " typical gig" + (n === 1 ? "" : "s") + " a week.";
      }
    }

    const formatChatTime = (value) => {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "" : date.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    };
    const visibleConversations = this.conversationsForRole(s, s.chatRole)
      .slice()
      .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    const resolvedConversation = visibleConversations.find((conversation) => conversation.id === s.activeConversationId) || visibleConversations[0] || null;
    const chatConversations = visibleConversations.map((conversation) => {
      const counterpart = s.chatRole === "client" ? conversation.freelancer : conversation.client;
      const lastMessage = conversation.messages[conversation.messages.length - 1];
      return {
        id: conversation.id,
        name: counterpart.name,
        initials: counterpart.initials || initialsFor(counterpart.name),
        orderTitle: conversation.order.title,
        preview: lastMessage ? lastMessage.body : "No messages yet",
        time: formatChatTime(conversation.updatedAt),
        selected: resolvedConversation && resolvedConversation.id === conversation.id,
        select: () => this.selectConversation(conversation.id),
      };
    });
    let activeChat = null;
    if (resolvedConversation) {
      const counterpart = s.chatRole === "client" ? resolvedConversation.freelancer : resolvedConversation.client;
      activeChat = {
        id: resolvedConversation.id,
        counterpartName: counterpart.name,
        counterpartInitials: counterpart.initials || initialsFor(counterpart.name),
        orderTitle: resolvedConversation.order.title,
        orderDetail: resolvedConversation.order.detail,
        contactPhone: resolvedConversation.client.phone,
        messages: resolvedConversation.messages.map((message) => ({
          ...message,
          mine: message.sender === s.chatRole,
          author: message.sender === "client" ? resolvedConversation.client.name : resolvedConversation.freelancer.name,
          time: formatChatTime(message.sentAt),
        })),
      };
    }

    return {
      isClient: s.viewMode === "client",
      isFreelancer: s.viewMode === "freelancer",
      isChat: s.viewMode === "chat",
      isOverviewTab: s.viewMode === "freelancer" && s.freelancerTab === "overview",

      setViewClient: this.setViewClient, setViewFreelancer: this.setViewFreelancer, setViewChat: this.setViewChat,

      cartEmpty: cartLines.length === 0, cartLines, cartSubtotal,

      checkoutOpen: s.checkoutOpen, checkoutPending: !s.orderPlaced, orderPlaced: s.orderPlaced,
      openCheckout: this.openCheckout, closeCheckout: this.closeCheckout,
      placeOrder: this.placeOrder, finishCheckout: this.finishCheckout,

      showFreelancerChats: () => this.setChatRole("freelancer"),

      chatEmpty: chatConversations.length === 0,
      activeChat,
      chatDraft: s.chatDraft,
      onChatDraftChange: this.onChatDraftChange,
      sendMessage: this.sendMessage,
      myGigs, stats,
      openNewGig: this.openNewGig, closeNewGig: this.closeNewGig, newGigOpen: s.newGigOpen, newGig: s.newGig,

          <React.Fragment>
            <div style={S("position:fixed;inset:0;background:rgba(15,18,20,.5);z-index:40")} onClick={v.toggleCart}></div>
            <div style={S("position:fixed;top:0;right:0;bottom:0;width:380px;max-width:92vw;background:var(--color-bg);z-index:41;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;border-left:1px solid var(--color-divider)")}>
              <div style={S("display:flex;justify-content:space-between;align-items:center;padding:var(--space-4);border-bottom:1px solid var(--color-divider)")}>
                <h2 style={S("margin:0;font-family:var(--font-heading);font-size:20px")}>Your cart</h2>
                <button type="button" className="btn btn-ghost" onClick={v.toggleCart}>Close</button>
              </div>
              <div style={S("flex:1;overflow-y:auto;padding:var(--space-3) var(--space-4)")}>
                {v.cartEmpty && <p style={S("color:var(--color-neutral-700);font-size:13px")}>Nothing here yet — add a gig from the feed.</p>}
                {v.cartLines.map((line) => (
                  <div key={line.key} style={S("display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--color-divider)")}>
                    <div style={S("flex:1")}>
                      <div style={S("font-size:13px;font-weight:600")}>{line.title}</div>
                      <div style={S("font-size:12px;color:var(--color-neutral-700);margin:2px 0 6px")}>{line.tierName} tier · ${line.price}</div>
                      <div style={S("display:flex;align-items:center;gap:8px")}>
                        <button type="button" className="btn btn-ghost" style={S("padding:2px 9px")} onClick={line.dec} aria-label="Decrease quantity">−</button>
                        <span style={S("font-size:13px;min-width:16px;text-align:center")}>{line.qty}</span>
                        <button type="button" className="btn btn-ghost" style={S("padding:2px 9px")} onClick={line.inc} aria-label="Increase quantity">+</button>
                        <button type="button" className="btn btn-ghost" style={S("margin-left:auto;color:var(--color-accent-700)")} onClick={line.remove}>Remove</button>
                      </div>
                    </div>
                    <div style={S("font-size:14px;font-weight:700;white-space:nowrap")}>${line.lineTotal}</div>
                  </div>
                ))}
              </div>
              <div style={S("padding:var(--space-4);border-top:1px solid var(--color-divider)")}>
                <div style={S("display:flex;justify-content:space-between;font-size:14px;margin-bottom:10px")}><span>Subtotal</span><strong>${v.cartSubtotal}</strong></div>
                <button type="button" className="btn btn-primary btn-block blueprint" onClick={v.openCheckout} disabled={v.cartEmpty}><Corners />Checkout</button>
              </div>
            </div>
          </React.Fragment>
        )}

        {v.selectedGig && (
          <div className="dialog-backdrop" style={S("position:fixed;z-index:50")}>
            <div className="dialog blueprint" style={S("max-width:480px")} role="dialog" aria-modal="true" aria-labelledby="ds-gig-title">
              <Corners />
              <ImageSlot height="180px" label={v.selectedGig.category} />
              <span className="tag tag-accent" style={S("margin-bottom:8px;display:inline-block")}>{v.selectedGig.category}</span>
              <div className="dialog-title" id="ds-gig-title">{v.selectedGig.title}</div>
              <div style={S("display:flex;align-items:center;gap:8px;margin:8px 0")}>
                <div style={S("width:26px;height:26px;border-radius:50%;background:var(--color-accent-700);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center")}>{v.selectedGig.freelancer.initials}</div>
                <div style={S("font-size:12px")}><strong>{v.selectedGig.freelancer.name}</strong> · ★ {v.selectedGig.freelancer.rating} ({v.selectedGig.freelancer.reviews})</div>
              </div>
              <div className="dialog-body">{v.selectedGig.desc}</div>
              <div style={S("display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:var(--space-3) 0")}>
                {v.selectedGig.tierOptions.map((tier) => (
                  <button key={tier.name} type="button" className={tier.cls} onClick={tier.select}>
                    <div style={S("font-size:12px;font-weight:700")}>{tier.name}</div>
                    <div style={S("font-size:15px;font-weight:700;margin:2px 0")}>${tier.price}</div>
                    <div style={S("font-size:11px;color:var(--color-neutral-700)")}>{tier.delivery}</div>
                  </button>
                ))}
              </div>
              <div className="dialog-actions">
                <button type="button" className="btn btn-secondary blueprint" onClick={v.closeGig}><Corners />Close</button>
                <button type="button" className="btn btn-secondary blueprint" onClick={v.messageSelectedFreelancer}><Corners />Message freelancer</button>
                <button type="button" className="btn btn-primary blueprint" onClick={v.addSelectedTier}><Corners />Add to cart</button>
              </div>
            </div>
          </div>
        )}

        {v.checkoutOpen && (
          <div className="dialog-backdrop" style={S("position:fixed;z-index:50")}>
            <div className="dialog blueprint" style={S("max-width:440px")} role="dialog" aria-modal="true" aria-labelledby="checkout-title">
              <Corners />
              {v.orderPlaced && (
                <React.Fragment>
                  <div className="dialog-title" id="checkout-title">Order placed</div>
                  <div className="dialog-body">Your request and contact number are ready in Chat. This is a prototype, so no real charge was made.</div>
                  <div className="dialog-actions">
                    <button type="button" className="btn btn-primary blueprint" data-proceed-chat onClick={v.finishCheckout}><Corners />Proceed to chat</button>
                  </div>
                </React.Fragment>
              )}
              {v.checkoutPending && (
                <form onSubmit={v.placeOrder}>
                  <div className="dialog-title" id="checkout-title">Checkout</div>
                  <div style={S("max-height:180px;overflow-y:auto;margin:10px 0")}>
                    {v.cartLines.map((line) => (
                      <div key={line.key} style={S("display:flex;justify-content:space-between;font-size:13px;padding:5px 0")}>
                        <span>{line.title} — {line.tierName} ×{line.qty}</span><strong>${line.lineTotal}</strong>
                      </div>
                    ))}
                  </div>
                  <div style={S("display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding-top:8px;border-top:1px solid var(--color-divider);margin-bottom:var(--space-3)")}><span>Total</span><span>${v.cartSubtotal}</span></div>
                  <div className="field"><label htmlFor="co-name">Name</label><input id="co-name" className="input" autoComplete="name" required value={v.checkoutName} onChange={v.onCheckoutNameChange} /></div>
                  <div className="field"><label htmlFor="co-email">Email</label><input id="co-email" className="input" type="email" autoComplete="email" required value={v.checkoutEmail} onChange={v.onCheckoutEmailChange} /></div>
                  <div className="field"><label htmlFor="co-phone">Contact number</label><input id="co-phone" className="input" type="tel" inputMode="tel" autoComplete="tel" required aria-invalid={v.checkoutError ? "true" : undefined} aria-describedby={v.checkoutError ? "checkout-error" : undefined} value={v.checkoutPhone} onChange={v.onCheckoutPhoneChange} /></div>
                  {v.checkoutError && <p className="checkout-error" id="checkout-error" role="alert">{v.checkoutError}</p>}
                  <div className="dialog-actions">
                    <button type="button" className="btn btn-secondary blueprint" onClick={v.closeCheckout}><Corners />Back to cart</button>
                    <button type="submit" className="btn btn-primary blueprint"><Corners />Place order</button>
                  </div>
                </form>
              )}
            </div>
          </div>
        )}

        {v.newGigOpen && (
          <div className="dialog-backdrop" style={S("position:fixed;z-index:50")}>
            <div className="dialog blueprint" style={S("max-width:480px;max-height:86vh;overflow-y:auto")} role="dialog" aria-modal="true">
              <Corners />
              <div className="dialog-title">Post a gig</div>
              <div className="field"><label htmlFor="ng-title">Title</label><input id="ng-title" className="input" placeholder="I will..." value={v.newGig.title} onChange={v.onNewGigTitleChange} /></div>
              <div className="field"><label htmlFor="ng-cat">Category</label>
                <select id="ng-cat" className="input" value={v.newGig.category} onChange={v.onNewGigCategoryChange}>
                  {v.skillCategories.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div className="field"><label htmlFor="ng-desc">Description</label><textarea id="ng-desc" className="input" rows="2" value={v.newGig.desc} onChange={v.onNewGigDescChange}></textarea></div>
              <div style={S("font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin:var(--space-3) 0 8px")}>Tiers</div>
              {v.newGigTierRows.map((row) => (
                <div key={row.name} style={S("display:flex;gap:6px;margin-bottom:8px;align-items:center")}>
                  <span style={S("width:64px;font-size:12px;font-weight:600")}>{row.name}</span>
                  <input className="input" style={S("width:80px")} placeholder="Price" value={row.price} onChange={row.onPrice} aria-label={row.name + " price"} />
                  <input className="input" placeholder="Delivery, e.g. 2 days" value={row.delivery} onChange={row.onDelivery} aria-label={row.name + " delivery"} />
                </div>
              ))}
              <div className="dialog-actions">
                <button type="button" className="btn btn-secondary blueprint" onClick={v.closeNewGig}><Corners />Cancel</button>
                <button type="button" className="btn btn-primary blueprint" onClick={v.submitNewGig}><Corners />Publish</button>
              </div>
            </div>
          </div>
        )}

      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

/* In-browser self-checks — the matching engine and the market numbers are the claims
   the demo makes, so they fail loudly in the console if the data or logic drifts. */
console.assert(SKILL_MARKET.length === 8 && SEED_GIGS.length === 16 && BRIEFS.length === 12, "seed sizes must stay 8/16/12");
console.assert(ratioOf("React").toFixed(1) === "3.2" && ratioOf("Data Entry").toFixed(1) === "0.8", "market ratios");
console.assert(ratioOf("Not a skill") === 0, "unknown skills must be guarded, not NaN");
console.assert(totalHoursOf(SEED_AVAIL) === 29, "seed availability totals 29 h");
console.assert(matchBriefs(SEED_AVAIL, ["React", "UI Design"]).map((b) => b.id).join(",") === "1,2,7", "seed match set and order");
console.assert(matchBriefs([], ["React"]).length === 0, "no declared hours means no matches");
console.assert(matchBriefs(SEED_AVAIL, []).length === 0, "no skills means no matches");
console.assert(windowForSlot(SEED_AVAIL, "Tue-EVE") === "Tuesday 7pm–10pm", "window label names the real overlap");
console.assert(windowForSlot(SEED_AVAIL, "Tue-AM") === null, "a band with no overlapping window does not match");
console.assert(mergeAvail([{ id: "x", day: "Mon", start: 9, end: 12 }, { id: "y", day: "Mon", start: 11, end: 14 }]).length === 1, "overlapping windows merge on drag end");
</script>
</body>
</html>
